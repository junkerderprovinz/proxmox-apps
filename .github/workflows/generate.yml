name: Generate

# The README's app list and its icons are built from the cards in
# junkerderprovinz/unraid-apps. A pull request only checks that they are
# current, and main rebuilds them every night and on demand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "52 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: junkerderprovinz/unraid-apps
          path: feed

      - name: Check
        if: github.event_name == 'pull_request'
        run: python3 tools/readme.py feed --check

      - name: Build
        if: github.event_name != 'pull_request'
        run: python3 tools/readme.py feed

      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git add .github/readme-icons README.md
          if git diff --cached --quiet; then
            echo "the app list is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild the app list from unraid-apps $(git -C feed rev-parse --short HEAD)"
          git push
